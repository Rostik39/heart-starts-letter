<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Для тебя</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="floaters" aria-hidden="true"></div>

  <!-- 1. Конверт -->
  <section id="intro" class="screen active">
    <button id="envelope" class="envelope" aria-label="Открыть письмо">
      <span class="env-back"></span>
      <span class="env-letter"><span class="heart-icon">&#10084;</span></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="env-seal">&#10084;</span>
    </button>
    <p class="hint">нажми на конверт</p>
  </section>

  <!-- 2. Сердце и слова -->
  <section id="main" class="screen">
    <canvas id="heart"></canvas>
    <div class="main-text">
      <h1 id="title"></h1>
      <p id="typed" class="typed"></p>
    </div>
    <button id="toReasons" class="btn hidden">дальше &rarr;</button>
  </section>

  <!-- 3. Причины -->
  <section id="reasons" class="screen">
    <h2>За что я тебя люблю</h2>
    <p class="sub">переверни каждую карточку</p>
    <div id="cards" class="cards"></div>
    <button id="toFinal" class="btn hidden">и самое главное &rarr;</button>
  </section>

  <!-- 4. Финал -->
  <section id="final" class="screen">
    <h2 id="finalTitle"></h2>
    <p id="finalText" class="final-text"></p>
    <div class="final-buttons">
      <button id="yes" class="btn big">Да!</button>
      <button id="no" class="btn ghost">Нет</button>
    </div>
    <p id="afterYes" class="after-yes hidden"></p>
  </section>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
