<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dcecff">
  <title>Для тебя</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="sky"><canvas id="stars"></canvas></div>

  <section id="intro" class="screen active">
    <button id="envelope" class="envelope" aria-label="Открыть письмо">
      <span class="env-back"></span>
      <span class="env-letter"></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="env-seal">&#10084;&#xFE0E;</span>
    </button>
    <p class="hint">нажми на конверт</p>
  </section>

  <section id="letter" class="screen">
    <div class="paper"><p id="letterText"></p></div>
    <p id="letterHint" class="hint">нажми, чтобы продолжить</p>
  </section>

  <section id="night" class="screen">
    <p id="question" class="question"></p>
  </section>

  <div id="wish" class="wish" aria-hidden="true">
    <div class="wish-inner">
      <div class="wish-glow"></div>
      <svg viewBox="0 0 100 100">
        <defs>
          <radialGradient id="starFill" cx="50%" cy="55%" r="55%">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.55" stop-color="#e8f3ff"/>
            <stop offset="1" stop-color="#a6d0ff"/>
          </radialGradient>
        </defs>
        <polygon id="starShape" fill="url(#starFill)" stroke="#a6d0ff" stroke-width="3.5" stroke-linejoin="round"/>
      </svg>
      <span id="wishText" class="wish-text"></span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
